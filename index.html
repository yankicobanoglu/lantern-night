<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1B1B3A" />
    <meta name="color-scheme" content="dark" />
    <title>Lantern Night</title>
    <style>
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url('fonts/nunito-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Pixelify Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/pixelify-sans-latin.woff') format('woff');
      }
      :root {
        --night: #1b1b3a;
        --apricot: #e8a07a;
        --glow: #ffb547;
        --cream: #fff4d6;
        --ink: #2a1a0a;
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --lantern-y: 70%;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--night);
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--cream);
      }
      #world {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        image-rendering: pixelated;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        touch-action: none;
        z-index: 2;
      }
      #ui[data-state='hidden'] { visibility: hidden; }
      .breath {
        position: absolute;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border-radius: 50%;
        border: 2px solid rgba(232, 160, 122, 0.55);
        box-shadow: 0 0 24px rgba(255, 181, 71, 0.25);
        opacity: 0;
        transform: scale(1);
        transition-property: transform, opacity;
        transition-timing-function: cubic-bezier(0.33, 0, 0.2, 1);
        transition-duration: 4000ms;
      }
      #ui[data-state='idle'] .breath { opacity: 0.45; transition-duration: 700ms; }
      .breath.holding { opacity: 0.9; transform: scale(4.2); }
      .breath.done { opacity: 0; transform: scale(4.8); transition-duration: 900ms; }
      #ui.gentle .breath.holding { transform: scale(2); }
      /* One translucent night panel above the lantern (SPEC section 7, UI surfaces). */
      .panel {
        position: absolute;
        left: 50%;
        bottom: calc(100% - var(--lantern-y) + 44px);
        transform: translateX(-50%);
        width: min(340px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 14px 18px 12px;
        border-radius: 12px;
        background: rgba(27, 27, 58, 0.72);
        border: 1px solid rgba(232, 160, 122, 0.2);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        text-align: center;
        transition: opacity 500ms ease;
      }
      .hint {
        margin: 0;
        min-height: 1.4em;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: 0.01em;
        transition: opacity 260ms ease;
      }
      .hint.fading { opacity: 0; }
      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 10px;
      }
      .actions:empty, .actions[data-empty='true'] { display: none; }
      .btn {
        pointer-events: auto;
        min-height: 44px;
        min-width: 44px;
        padding: 10px 22px;
        border-radius: 12px;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 400ms ease, transform 400ms ease;
      }
      .btn[hidden] { display: none; }
      .btn.primary {
        background: var(--glow);
        color: var(--ink);
        border: 1px solid rgba(232, 160, 122, 0.2);
      }
      .btn.ghost {
        background: transparent;
        color: var(--cream);
        border: 1px solid rgba(232, 160, 122, 0.35);
      }
      .btn:focus-visible {
        outline: 2px solid var(--cream);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .breath { transition-duration: 600ms !important; }
      }
    </style>
  </head>
  <body>
    <canvas id="world" aria-label="A quiet lake at dusk. Hills with two lit cottages and chimney smoke, pine trees, a rowing boat on the water, mist, and the moon in the upper right sky. A paper lantern waits on the grassy shore; released lanterns rise and settle among the stars."></canvas>
    <div id="ui" data-state="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
