<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1B1B3A" />
    <meta name="color-scheme" content="dark" />
    <title>Lantern Night</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1B1B3A;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #world {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="world" aria-label="A quiet lake at dusk. Hills with two lit cottages, pine trees, a wooden dock, and the moon in the upper right sky."></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
